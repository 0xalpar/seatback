name: backend
on:
  push:
    branches: [backend]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo run -p seatback-idl-gen
        env:
          RUSTUP_TOOLCHAIN: 1.89.0
          # Published IDL builder 0.1.2 forces procmacro2_semver_exempt. This
          # compiler-only setting is scoped to IDL generation, never SBF builds.
          RUSTC_BOOTSTRAP: 1
      - name: Generated IDL
        run: echo "IDL_BASE64=$(base64 -w0 packages/chain-client/idl/seatback.json)"
      - name: Install Agave build tools
        run: |
          curl --fail --location --retry 3 https://github.com/anza-xyz/agave/releases/download/v2.3.13/solana-release-x86_64-unknown-linux-gnu.tar.bz2 -o "$RUNNER_TEMP/agave.tar.bz2"
          tar -xjf "$RUNNER_TEMP/agave.tar.bz2" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/solana-release/bin" >> "$GITHUB_PATH"
      - run: cargo build-sbf --manifest-path programs/seatback/Cargo.toml --tools-version v1.56 --arch v0
      - run: cargo test -p seatback -p seatback-chain-tests -- --nocapture
        env:
          SBF_OUT_DIR: ${{ github.workspace }}/target/deploy
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:foundation
      - run: pnpm check
