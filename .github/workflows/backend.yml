name: backend
on:
  push:
    branches: [backend, release/mvp]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: cargo run --locked -p seatback-idl-gen
        env:
          RUSTUP_TOOLCHAIN: 1.89.0
          # Published IDL builder 0.1.2 forces procmacro2_semver_exempt. This
          # compiler-only setting is scoped to IDL generation, never SBF builds.
          RUSTC_BOOTSTRAP: 1
      - name: Install Agave build tools
        run: |
          curl --fail --location --retry 3 https://github.com/anza-xyz/agave/releases/download/v2.3.13/solana-release-x86_64-unknown-linux-gnu.tar.bz2 -o "$RUNNER_TEMP/agave.tar.bz2"
          tar -xjf "$RUNNER_TEMP/agave.tar.bz2" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/solana-release/bin" >> "$GITHUB_PATH"
      - name: Verify public program identity and tool versions (no deployment keys)
        run: |
          rustc --version
          solana --version
          cargo build-sbf --version
          node scripts/check-program-id.mjs
          bash -n scripts/prepare-devnet.sh scripts/deploy-devnet.sh scripts/import-local-devnet-keys.sh
      - run: cargo build-sbf --manifest-path programs/seatback/Cargo.toml --tools-version v1.56 --arch v0 -- --locked
      - run: cargo test --locked -p seatback -p seatback-chain-tests -- --nocapture
        env:
          SBF_OUT_DIR: ${{ github.workspace }}/target/deploy
      - name: Check generated IDL and dependency lock are current
        run: git diff --exit-code -- Cargo.lock packages/chain-client/idl/seatback.json
      - name: Record tested SBF artifact provenance (public data only)
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          binary = pathlib.Path('target/deploy/seatback.so').read_bytes()
          proof = {'sourceCommit': os.environ['GITHUB_SHA'], 'programId': json.loads(pathlib.Path('packages/chain-client/idl/seatback.json').read_text())['address'], 'bytes': len(binary), 'sha256': hashlib.sha256(binary).hexdigest(), 'agave': '2.3.13', 'platformTools': 'v1.56', 'arch': 'v0', 'status': 'compiled-and-tested-not-deployed'}
          pathlib.Path('target/deploy/build-provenance.json').write_text(json.dumps(proof, indent=2)+'\n')
          print(json.dumps(proof))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: seatback-sbf-and-idl
          path: |
            target/deploy/seatback.so
            target/deploy/build-provenance.json
            packages/chain-client/idl/seatback.json
            Cargo.lock
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [embedded, postgres]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: seatback_test
          POSTGRES_PASSWORD: seatback_test
          POSTGRES_DB: seatback_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql://seatback_test:seatback_test@localhost:5432/seatback_test' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:foundation
      - run: pnpm check
