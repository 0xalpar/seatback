worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    sendfile on;
    server_tokens off;
    client_max_body_size 64k;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    # Docker DNS: resolve the API again after container replacement.
    resolver 127.0.0.11 valid=10s ipv6=off;
    server {
        listen 8080;
        root /usr/share/nginx/html;
        add_header X-Content-Type-Options nosniff always;
        location = /frontend-health { access_log off; return 200 "ok\n"; }
        location = /health { set $backend api:3001; proxy_pass http://$backend$request_uri; }
        location /v1/ {
            set $backend api:3001;
            proxy_pass http://$backend$request_uri;
            proxy_set_header Host $http_host;
            # Forward the real browser Origin unchanged for backend CSRF/domain checks.
            proxy_set_header Origin $http_origin;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_buffering off;
            add_header Cache-Control "no-store" always;
        }
        location /assets/ { try_files $uri =404; expires 1y; add_header Cache-Control "public, immutable"; }
        location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache"; }
    }
}
