[toolchain]
anchor_version = "0.32.1"
[features]
resolution = true
skip-lint = false
[provider]
cluster = "Devnet"
wallet = "~/.config/seatback/devnet/deployer-keypair.json"
[workspace]
members = ["programs/seatback"]
# No deployed program address is claimed. Generate a devnet keypair, replace
# declare_id and add [programs.devnet] with scripts/configure-devnet.mjs, then
# regenerate compiler IDL with scripts/prepare-devnet.sh. Never copy deployment keys into Git.
