name: public-demo
on:
  push:
    branches: [release/mvp]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  external-https:
    runs-on: ubuntu-latest
    steps:
      - name: Check anonymous HTTPS demo from an independent hosted machine
        run: |
          python3 - <<'PY'
          import re, urllib.request
          origin = 'https://seatback.alpar-dikkatli37347.chatgpt.site'
          def get(path):
              request = urllib.request.Request(origin + path, headers={'User-Agent': 'Mozilla/5.0 SeatBackPublicReadiness/1.0', 'Accept': '*/*'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  assert response.status == 200
                  assert response.url.startswith(origin)
                  return response.read().decode()
          page = get('/')
          assert 'http-equiv="Content-Security-Policy"' in page
          assert "connect-src 'none'" in page
          entry = re.search(r'<script[^>]+src="([^"]+)"', page).group(1)
          code = get(entry)
          assert 'Read-only demo' in code
          assert '127.0.0.1:8899' not in code and 'localhost:8899' not in code
          assert '<div id="root">' in get('/organizer/events')
          print('Anonymous HTTPS, SPA routing, read-only label and network isolation verified externally.')
          PY
