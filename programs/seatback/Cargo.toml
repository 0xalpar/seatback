[package]
name = "seatback"
version = "0.1.0"
edition = "2021"
[lib]
crate-type = ["cdylib", "lib"]
name = "seatback"
[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "dep:proc-macro2"]
[dependencies]
anchor-lang = { version = "=0.32.1", features = ["init-if-needed"] }
sha2 = "=0.10.9"
proc-macro2 = { version = "=1.0.103", features = ["proc-macro"], optional = true }
[dev-dependencies]
solana-program-test = "=2.3.13"
solana-sdk = "=2.3.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
